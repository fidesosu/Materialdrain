# The Materialdrain website: the home page with the downloads at /, the documentation at /docs/. Static files, kept up
# to date by materialdrain-site-sync.timer. HTTP only to start with: certbot --nginx adds HTTPS and the redirect to it.
server {
    listen 80;
    listen [::]:80;
    server_name materialdrain.senko.tools;

    root /var/www/materialdrain;
    index index.html;

    # Debian's nginx.conf turns gzip on, but only for HTML: the stylesheets, scripts, the releases and the
    # documentation's search index (some 300 KB) are worth it too
    gzip_types text/css application/javascript application/json text/xml image/svg+xml;

    # The site's git data, and any other hidden file, is never served (certbot's .well-known excepted)
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # The home page
    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }

    # The app's releases, as the sync last read them from GitHub. Checked again on every visit: Last-Modified is when
    # the server last asked GitHub, which the download page shows. A location's own add_header drops the server's,
    # so they're repeated here
    location = /releases.json {
        alias /var/www/materialdrain-releases/releases.json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The documentation, with its own "not found" page
    location = /docs {
        return 301 /docs/;
    }
    location /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # App builds, if they're ever kept here: installable when opened on a phone
    location ~* \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Browsers only take this over HTTPS: once certbot has added it, they never try plain HTTP again for a year
    add_header Strict-Transport-Security "max-age=31536000" always;
}
