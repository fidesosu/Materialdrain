# --- Memory & JVM Settings ---
# Increased heap memory (adjust to 4096m if your machine has 16GB+ RAM)
# Enabled parallel GC and tier-1 compiler optimization for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# --- Build Speed & Caching ---
# Enables caching of task outputs across builds
org.gradle.caching=true

# Executes tasks in parallel across independent modules
org.gradle.parallel=true

# Keeps the daemon alive and reuses project state across builds
org.gradle.configuration-cache=true

# Reuses compilation outputs for non-changed files
kotlin.incremental=true

# --- Android Gradle Plugin (AGP) Optimizations ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enables non-final R classes for faster incremental compilation
android.nonFinalResIds=true

# Deprecated/Removed options cleaned up:
# - android.uniquePackageNames (Obsolete in modern AGP versions)
# - android.dependency.useConstraints (Replaced/handled by AGP defaults)

# --- Code Style ---
kotlin.code.style=official
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
