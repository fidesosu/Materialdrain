#file: noinspection SpellCheckingInspection
# The emulator tests of how the app behaves on different Android versions: the app lock and what other apps can reach
# (app/src/androidTest/.../security), and the theme, downloads, the file picker and the lists (.../compat). On Android 10,
# the oldest the app runs on, and on the Android the app targets, each on an emulator of its own.
# Run once a week on dev, for each pull request into main, and by "Run workflow" on the Actions tab. The results and the
# pictures the tests take are kept with the run.
name: Android versions

on:
  schedule:
    # Mondays at 04:00 UTC
    - cron: "0 4 * * 1"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Each version's results, even when the other one fails
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      # The weekly run is of dev, where the changes go first (a scheduled run is of the default branch otherwise). The
      # whole history and the tags, which the version is worked out from (see app/build.gradle.kts)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # The emulator runs far faster with the processor's virtualization, which the runner has but doesn't allow by default
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The screen stays on: the lock tests give the device a PIN, and once the screen goes off its lock screen would
      # stop the rest. Each line is a command of its own; one run per package, as a list of them runs only the first
      # (the security results are moved aside, as the second run would replace them)
      - name: Run the tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            ./gradlew :app:connectedDebugAndroidTest -x copyScreenshots -Pandroid.testInstrumentationRunnerArguments.package=tools.senko.materialdrain.security && mv app/build/outputs/androidTest-results/connected app/build/outputs/security-results
            ./gradlew :app:connectedDebugAndroidTest -x copyScreenshots -Pandroid.testInstrumentationRunnerArguments.package=tools.senko.materialdrain.compat

      - name: Keep the results and pictures with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.api-level }}
          path: |
            app/build/outputs/security-results
            app/build/outputs/androidTest-results/connected
            app/build/outputs/connected_android_test_additional_output
            app/build/reports/androidTests/connected
