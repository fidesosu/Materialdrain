# Builds the website, https://materialdrain.senko.tools: the home page (website/) at its root and the developer
# documentation (mkdocs.yml, docs/) under /docs/. The result is stored in the site branch, as a single commit; the
# server pulls that branch and serves it (see docs/server-setup/), so this workflow needs no secrets of its own and
# nothing here can reach the server.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/site.yml"
  # A button on the Actions tab, to publish without a change
  workflow_dispatch:

# Only to push the built site to the site branch
permissions:
  contents: write

# A newer push replaces a build still running
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r docs/requirements.txt

      # --strict: a broken link or a missing page fails the build, instead of being published
      - name: Build
        run: |
          mkdocs build --strict --site-dir _site/docs
          cp -r website/. _site/

      # The site branch is replaced with one new commit each time, so it never grows
      - name: Publish to the site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init --quiet --initial-branch site
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Site built from ${GITHUB_SHA}"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
