# Newer versions, once a month, as one pull request for the libraries (gradle/libs.versions.toml, the Gradle wrapper) and
# one for the actions of the workflows, into dev (where the app's changes go first). Each is built on its pull request
# (build.yml) before it's merged
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      libraries:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
