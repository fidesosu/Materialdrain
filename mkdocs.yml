# The developer documentation, served at https://materialdrain.senko.tools/docs/ (the home page with the downloads is
# website/). Built by .github/workflows/site.yml into the site branch, which the server pulls (see docs/server-setup/).
site_name: Materialdrain docs
site_url: https://materialdrain.senko.tools/docs/
site_description: How Materialdrain is built, where things are, and why they're done the way they are.
repo_url: https://github.com/fidesosu/Materialdrain
repo_name: fidesosu/Materialdrain
edit_uri: edit/main/docs/

docs_dir: docs
# Not part of the site: the server's setup files, the build's own requirements, and a built copy of the site
exclude_docs: |
  server-setup/
  requirements.txt
  materialdrain/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Hosts:
      - Provider configuration: provider-configuration.md
